# Schedule Alerter — zero-infra scheduled run
#
# Runs the scraper every 30 minutes on GitHub's hosted runners.
# Each run fetches the 7-day schedule, diffs against cache, and alerts
# Telegram if anything changed. Uses the `run-once` mode.

name: schedule-alerter

on:
  schedule:
    # Every 30 minutes (matching the default poll interval)
    - cron: "*/30 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write  # Need write to upload artifacts

concurrency:
  group: schedule-alerter-runs
  cancel-in-progress: false

jobs:
  run-once:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      # Download cache from previous run so we can diff against it
      - name: Download cache from previous run
        uses: actions/download-artifact@v4
        with:
          name: schedule-cache
          path: .schedule-cache/
        continue-on-error: true

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Create config.yaml from template
        run: cp config.yaml.example config.yaml

      - name: Run schedule alerter (run-once)
        run: node dist/cli.js run-once
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      # Persist the schedule cache so the NEXT scheduled run has prior state
      - name: Upload cache for the next run
        uses: actions/upload-artifact@v4
        with:
          name: schedule-cache
          path: .schedule-cache/
          include-hidden-files: true
          if-no-files-found: ignore