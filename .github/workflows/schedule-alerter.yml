# Schedule Alerter — zero-infra scheduled run
#
# Runs the scraper every 30 minutes on GitHub's hosted runners.
# Each run fetches the 7-day schedule, diffs against cache, and alerts
# WhatsApp/CallMeBot if anything changed. Uses the `run-once` mode.

name: schedule-alerter

on:
  schedule:
    # Every 30 minutes (matching the default poll interval)
    - cron: "*/30 * * * *"
  workflow_dispatch: {}

# Permission to read the repo, plus abort in-flight runs when a new one
# (e.g. a manual dispatch) supersedes a queued scheduled run.
permissions:
  contents: read

concurrency:
  group: schedule-alerter-runs
  cancel-in-progress: false

jobs:
  run-once:
    runs-on: ubuntu-latest
    timeout-minutes: 10 # stay well inside the hosted-runner job limit
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      # Cache the installed node_modules so clean scheduled runs skip the
      # expensive `npm ci` dependency resolution when the lockfile is unchanged.
      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-modules-

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Create config from template
        run: |
          cp config.yaml.example config.yaml
          # Secrets are injected as env vars below; config reads ${VAR}
          # placeholders and interpolates them at runtime.

      - name: Run schedule alerter (run-once)
        run: node dist/cli.js run-once
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # WhatsApp disabled (optional): uncomment if you add CallMeBot secrets
          # WHATSAPP_API_KEY: ${{ secrets.WHATSAPP_API_KEY }}
          # WHATSAPP_PHONE: ${{ secrets.WHATSAPP_PHONE }}
          # Email fallback (optional): uncomment if you add Gmail app password
          # SMTP_USER: ${{ secrets.SMTP_USER }}
          # SMTP_PASS: ${{ secrets.SMTP_PASS }}

      # Persist the schedule cache so the NEXT scheduled run has prior state
      # to diff against (avoids a re-alert every 30 minutes).
      - name: Upload cache for the next run
        uses: actions/upload-artifact@v4
        with:
          name: schedule-cache
          path: .schedule-cache/
          include-hidden-files: true
          if-no-files-found: ignore

      # The cache lives on the runner, but GitHub Actions ephemeral runners
      # reset between jobs. A manual dispatch (workflow_dispatch) cannot rely
      # on a restored artifact, so treat a missing cache as a first run — the
      # application already suppresses the alert in that case.
