# Schedule Alerter — zero-infra scheduled run
#
# Runs the scraper every 30 minutes on GitHub's hosted runners.
# Each run fetches the 7-day schedule, diffs against cache, and alerts
# Telegram if anything changed. Uses the `run-once` mode.

name: schedule-alerter

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: schedule-alerter-runs
  cancel-in-progress: false

jobs:
  run-once:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      # Restore schedule cache from previous run
      - name: Restore schedule cache
        uses: actions/cache@v4
        with:
          path: .schedule-cache/
          key: schedule-cache-${{ github.run_id }}
          restore-keys: |
            schedule-cache-

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Create config.yaml from template
        run: cp config.yaml.example config.yaml

      # DEBUG: Verify secrets are available (shows length, not the actual value)
      - name: Debug - Check secrets
        run: |
          echo "TELEGRAM_BOT_TOKEN length: ${#TELEGRAM_BOT_TOKEN}"
          echo "TELEGRAM_CHAT_ID length: ${#TELEGRAM_CHAT_ID}"
          echo "Config cachePath:"
          cat config.yaml | grep cachePath
          echo "Cache directory contents:"
          ls -la .schedule-cache/ 2>/dev/null || echo "No cache directory yet"

      - name: Run schedule alerter (run-once)
        run: node dist/cli.js run-once
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}