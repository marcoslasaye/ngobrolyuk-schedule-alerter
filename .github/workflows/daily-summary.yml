name: daily-schedule-summary

on:
  schedule:
    - cron: "0 0 * * *"  # 00:00 UTC = 7:00 Bali (UTC+8)
  workflow_dispatch: {}

permissions:
  contents: write  # Need write to commit HTML file

jobs:
  daily-summary:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      # Download cache from previous run so we have the schedule data
      - name: Download cache from previous run
        uses: actions/download-artifact@v4
        with:
          name: schedule-cache
          path: .schedule-cache/
        continue-on-error: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      # Cache the installed node_modules so clean scheduled runs skip the
      # expensive `npm ci` dependency resolution when the lockfile is unchanged.
      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-modules-

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Create config.yaml from template
        run: |
          cp config.yaml.example config.yaml
          # The config reads ${VAR} placeholders and interpolates them at runtime
          # from environment variables (which we set below)

      - name: Generate daily schedule HTML with date-based filename
        run: |
          DATE=$(date -u +"%Y-%m-%d")
          node dist/cli.js horario-hoy --html --output "horarios/horario-${DATE}.html"
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      - name: Send to Telegram
        run: node dist/cli.js horario-hoy --telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      - name: Commit and push HTML file
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add horarios/
          git commit -m "📅 Add daily schedule $(date -u +'%Y-%m-%d')" || echo "No changes to commit"
          git push