name: daily-schedule-summary

on:
  schedule:
    - cron: "0 0 * * *"  # 00:00 UTC = 7:00 Bali (UTC+8)
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  daily-summary:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      # Cache the installed node_modules so clean scheduled runs skip the
      # expensive `npm ci` dependency resolution when the lockfile is unchanged.
      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-modules-

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Create config.yaml from template
        run: |
          cp config.yaml.example config.yaml
          # The config reads ${VAR} placeholders and interpolates them at runtime
          # from environment variables (which we set below)

      - name: Send daily schedule to Telegram
        run: node dist/cli.js horario-hoy --telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}